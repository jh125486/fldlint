# fldlint Taskfile (https://taskfile.dev). `task check` is the single entry
# point for both local use and CI (see docs/m0-contract.md, M0.7).
version: '3'

silent: true

vars:
  GEN_FILES: js/packages/spec/src/rules.gen.ts go/internal/spec/rules_gen.go spec/generated/spec.json go/internal/spec/testdata/spec.json java/src/main/java/io/github/jh125486/fldlint/spec/RulesGen.java
  # Pinned; CI and local both run this exact version via `go run`.
  GOLANGCI_LINT: github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
  # Pinned workflow linters; CI and local both run these exact versions.
  ACTIONLINT: github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
  ZIZMOR: zizmor@1.33.1

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  check:
    desc: Everything a good commit needs (check:shared, check:go, check:js, Java lint and tests)
    cmds:
      # Serial: spec:check regenerates files and js:types-floor swaps @types/node.
      - task: check:shared
      - task: check:go
      - task: check:js
      - task: java:lint
      - task: java:test

  check:shared:
    desc: Language-independent checks (spec:check, workflows:test, parity); CI runs it on any non-docs change
    cmds:
      - task: spec:check
      - task: workflows:test
      - task: parity

  check:go:
    desc: Go lint and race tests
    cmds:
      - task: go:lint
      - task: go:test

  check:js:
    desc: JS lint, tests and the @types/node floor
    cmds:
      - task: js:lint
      - task: js:test
      - task: js:types-floor

  check:node:
    desc: Node-version-dependent subset of check (JS typecheck/ESLint, JS tests, JS side of parity); CI runs it on the non-floor Node legs
    cmds:
      - task: js:lint
      - task: js:test
      - task: parity

  spec:check:
    desc: Validate spec, regenerate code, fail on drift, check fixture tags
    cmds:
      - task: js:install
      - cd js && npm run spec:validate
      - task: spec:gen
      - |
        test -z "$(git status --porcelain -- {{.GEN_FILES}})" || {
          echo "spec:check: generated files are out of date, run 'task spec:gen' and commit:" >&2
          git status --porcelain -- {{.GEN_FILES}} >&2
          exit 1
        }
      - task: spec:tags

  spec:gen:
    desc: Validate the spec and regenerate spec/generated/spec.json plus the JS, Go and Java rule tables
    cmds:
      - cd js && npm run gen -w @fldlint/spec
      - cd go && go run ./internal/spec/gen

  spec:tags:
    desc: Check mandatory fixture tag coverage (ALLOW_EMPTY=1 tolerates missing fixtures)
    cmds:
      - cd js && npm run spec:tags --silent{{if eq .ALLOW_EMPTY "1"}} -- --allow-empty{{end}}

  js:install:
    desc: Install JS dependencies from the lockfile (npm ci)
    run: once
    cmds:
      - cd js && npm ci

  js:test:
    desc: Install and run JS tests
    deps: [js:install]
    cmds:
      - cd js && npm test

  js:lint:
    desc: Typecheck and ESLint the JS workspace (npm run lint)
    deps: [js:install]
    cmds:
      - cd js && npm run lint

  js:types-floor:
    desc: Typecheck against the @types/node 22.13.0 floor (not saved; restored afterwards)
    cmds:
      - task: js:install
      - defer: cd js && npm ci
      - cd js && npm install --no-save --workspaces --include-workspace-root '@types/node@22.13.0'
      - |
        cd js && node -e "const v=require('@types/node/package.json').version; if(v!=='22.13.0'){console.error('expected @types/node 22.13.0, got '+v);process.exit(1)}"
      - cd js && npm run typecheck

  js:test-eslint9:
    desc: Run the eslint-plugin tests against ESLint 9.39.5, the peer range floor (not saved; restored afterwards)
    cmds:
      - task: js:install
      - defer: cd js && npm ci
      - cd js && npm install --no-save --workspaces --include-workspace-root eslint@9.39.5 @eslint/js@9.39.5
      - |
        cd js && node -e "const v=require('eslint/package.json').version; if(v!=='9.39.5'){console.error('expected eslint 9.39.5, got '+v);process.exit(1)}"
      - cd js && npm test -w eslint-plugin-fldlint

  js:ts-next:
    desc: Canary, typecheck and build with typescript@latest (not saved; restored afterwards)
    cmds:
      - task: js:install
      - defer: cd js && npm ci
      - cd js && npm install --no-save typescript@latest
      - cd js && npx tsc -v
      - cd js && npm run typecheck
      - cd js && npm run build

  go:test:
    desc: Run Go tests with the race detector
    cmds:
      - cd go && go test -race ./...

  go:lint:
    desc: Run golangci-lint (pinned v2.15.0 via go run)
    cmds:
      - cd go && go run {{.GOLANGCI_LINT}} run ./...

  java:test:
    desc: Run the Java build and tests (JDK 21; ./mvnw verify, includes the conformance harness; FLDLINT_SKIP_JAVA=1 skips)
    cmds:
      - |
        if [ "$FLDLINT_SKIP_JAVA" = "1" ]; then echo "java:test skipped (FLDLINT_SKIP_JAVA=1)"; exit 0; fi
        cd java && ./mvnw -B verify

  java:lint:
    desc: Spotless format check, then compile Java main and test with -Xlint:all -Werror and Error Prone (own build dir; fix format with 'cd java && ./mvnw spotless:apply'; FLDLINT_SKIP_JAVA=1 skips)
    cmds:
      - |
        if [ "$FLDLINT_SKIP_JAVA" = "1" ]; then echo "java:lint skipped (FLDLINT_SKIP_JAVA=1)"; exit 0; fi
        cd java && ./mvnw -B -q -Plint test-compile

  java:smoke:
    desc: Run the published-style recipes through rewrite-maven-plugin dryRun in java/smoke (installs a local snapshot first; FLDLINT_SKIP_JAVA=1 skips). Not part of 'task check'; CI runs it in the java job
    cmds:
      - |
        if [ "$FLDLINT_SKIP_JAVA" = "1" ]; then echo "java:smoke skipped (FLDLINT_SKIP_JAVA=1)"; exit 0; fi
        set -e
        cd java && ./mvnw -B -DskipTests install
        ver=$(./mvnw -q -B org.apache.maven.plugins:maven-help-plugin:3.6.0:evaluate -Dexpression=project.version -DforceStdout)
        cd smoke && rm -rf target/rewrite && ../mvnw -B -Dfldlint.version="$ver" \
          org.openrewrite.maven:rewrite-maven-plugin:6.46.1:dryRun \
          -Drewrite.recipeArtifactCoordinates=io.github.jh125486:fldlint-rewrite:"$ver" \
          -Drewrite.activeRecipes=io.github.jh125486.fldlint.MigrateLaunchDarklyToOpenFeature,io.github.jh125486.fldlint.FindLaunchDarklyUsage
        patch=target/rewrite/rewrite.patch
        fail() { echo "java:smoke: $1" >&2; exit 1; }
        test -s "$patch" || fail "$patch is missing or empty"
        # The four rewritten calls (added lines), by flag key.
        for pair in Boolean:smoke-bool String:smoke-string Double:smoke-number Integer:smoke-int; do
          t=${pair%%:*}; k=${pair#*:}
          grep -Eq "^\+.*get${t}Value\(\"${k}\"" "$patch" || fail "no rewrite to get${t}Value(\"${k}\") in $patch"
        done
        # One skip marker per reported call, by category.
        for c in default-type-unproven dynamic-key detail bulk; do
          [ "$(grep -c "\[skip: $c\]" "$patch")" -eq 1 ] || fail "expected exactly one [skip: $c] in $patch"
        done
        [ "$(grep -c '\[skip: type-mismatch\]' "$patch")" -eq 2 ] || fail "expected two [skip: type-mismatch] (json, migration) in $patch"
        # The unrelated class must not be touched or marked.
        if grep -E '^[-+].*(toggles\.boolVariation|smoke-unrelated)' "$patch"; then fail "unrelated call changed or marked in $patch"; fi

  workflows:test:
    desc: Table test for the CI change classifier (.github/scripts/classify-changes.sh)
    cmds:
      - bash .github/scripts/classify-changes.test.sh

  workflows:lint:
    desc: Test the change classifier, then lint .github/workflows with actionlint (go run) and zizmor (uvx, needs uv)
    cmds:
      - task: workflows:test
      - cd go && go run {{.ACTIONLINT}} -color ../.github/workflows/*.yml
      - uvx {{.ZIZMOR}} --persona=regular .github/workflows

  parity:
    desc: Recompute the shared fingerprint vectors and a baseline in JS and Go; outputs must be byte-identical
    deps: [js:install]
    cmds:
      - cd js && npm run build -w @fldlint/core --silent
      - |
        set -e
        d=$(mktemp -d); trap 'rm -rf "$d"' EXIT
        v=spec/contracts/fingerprint-vectors.json
        node js/packages/core/dist/bin/fp.js "$v" > "$d/js.txt"
        (cd go && go run ./internal/fingerprint/cmd/fp "../$v") > "$d/go.txt"
        node -e 'for (const v of JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))) console.log(v.fingerprint)' "$v" > "$d/want.txt"
        diff "$d/js.txt" "$d/go.txt"
        diff "$d/js.txt" "$d/want.txt"
        node js/packages/core/dist/bin/fp.js --baseline "$d/js.json" "$v"
        (cd go && go run ./internal/fingerprint/cmd/fp --baseline "$d/go.json" "../$v")
        cmp "$d/js.json" "$d/go.json"
        echo "parity: $(wc -l < "$d/js.txt" | tr -d ' ') fingerprints and the baseline file are identical in JS and Go"

  lint:
    desc: Run all linters (JS, Go and Java)
    deps: [js:lint, go:lint, java:lint]

  test:
    desc: Run all tests (JS, Go and Java)
    deps: [js:test, go:test, java:test]
