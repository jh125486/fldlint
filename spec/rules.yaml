# fldlint rules: language-neutral source of truth. Schema: spec/schema/rules.schema.json.
#
# Argument positions (keyArg/defaultArg/contextArg) are for the base (non-Ctx)
# call: JS and Go both use (key, context, default). Go *Ctx methods take a
# leading context.Context at the index given by ctxArg; the remaining positions
# shift by one for those methods.
#
# Sources: JS method list from flaglint-js scanner (LD_FLAG_KEY_METHODS,
# LD_ALL_FLAGS_METHODS); Go from flaglint-go methodSpecs, signatures checked
# against go-server-sdk v7 ldclient.go and openfeature-go client.go.
# "requires: [context-unproven]" (JS and Go) means the rewrite is only applied
# when the LD context -> EvaluationContext conversion can be proven (JS: a
# literal { key } / { kind: "user", key } object; Go: ldcontext.New(x));
# otherwise the planner reports skip=context-unproven.
#
# Report-only rules carry only keyArg (the fingerprint key, M0.9; all-flags-state
# stays keyless) plus, on every language binding, argCount {min, max}: the
# number of call arguments the SDK method accepts, for the non-Ctx form
# (rewriting rules get their arity from keyArg/defaultArg/contextArg and must
# not carry argCount). A call whose argument count is outside [min, max] is not
# a recognized SDK call. Go methods in that binding's ctxArg add one (the
# leading context.Context). `max` is omitted only for a variadic method (Go
# AllFlagsState). Counts verified against @launchdarkly/js-server-sdk-common
# 2.26.8 (LDClient.d.ts; JS variation/variationDetail/allFlagsState take an
# optional trailing callback) and go-server-sdk v7.23.0 (ldclient.go) and
# launchdarkly-java-server-sdk 7.18.1 (LDClientInterface via javap: every Java variation, detail
# and migrationVariation method takes (String, LDContext, default); allFlagsState takes
# (LDContext, FlagsStateOption...), variadic).
#
# `message` (rewriting rules only) is the diagnostic text for a rewritable
# finding; the only placeholder allowed in it is {{key}}.
#
# JS method list verified against @launchdarkly/node-server-sdk 9.17.1 and
# @launchdarkly/js-server-sdk-common 2.26.8 typings: allFlags and
# isFeatureEnabled do not exist there (they were only in the legacy
# launchdarkly-node-server-sdk) and are therefore not listed.
version: 1
skipCategories:
  detail:           {severity: warning, message: "Detail call; reason/variation metadata has no 1:1 rewrite"}
  bulk:             {severity: warning, message: "Bulk evaluation; migrate manually"}
  dynamic-key:      {severity: warning, message: "Flag key is not a static string"}
  unbound-client:   {severity: warning, message: "OpenFeature client binding not proven in scope"}
  type-mismatch:    {severity: warning, message: "Return/default type differs between SDKs"}
  context-unproven: {severity: warning, message: "Cannot prove LD context -> EvaluationContext conversion"}
  default-type-unproven: {severity: warning, message: "Default value type not proven"}
  receiver-unproven: {severity: warning, message: "LaunchDarkly client expression cannot be removed safely"}
rules:
  # ---- rewritable rules ----
  - id: bool-variation
    message: "Migrate boolean flag {{key}} to OpenFeature"
    valueType: boolean
    risk: low
    keyArg: 0
    defaultArg: 2
    contextArg: 1
    languages:
      js:   {methods: [boolVariation], async: true,
             template: "{{client}}.getBooleanValue({{key}}, {{default}}, {{context}})",
             requires: [context-unproven]}
      go:   {methods: [BoolVariation, BoolVariationCtx], ctxArg: {BoolVariationCtx: 0},
             template: "{{client}}.BooleanValue({{goctx}}, {{key}}, {{default}}, {{evalctx}})",
             requires: [context-unproven]}
      # Java keeps LaunchDarkly's primitive typing with .booleanValue() (ADR 009 D8). The recipe
      # fills the placeholders by order of appearance and gives #{context} its own template.
      java: {methods: [boolVariation], requires: [context-unproven, default-type-unproven],
             template: "#{any(dev.openfeature.sdk.Client)}.getBooleanValue(#{key}, #{default}, #{context}).booleanValue()"}
  - id: string-variation
    message: "Migrate string flag {{key}} to OpenFeature"
    valueType: string
    risk: low
    keyArg: 0
    defaultArg: 2
    contextArg: 1
    languages:
      js: {methods: [stringVariation], async: true,
           template: "{{client}}.getStringValue({{key}}, {{default}}, {{context}})",
           requires: [context-unproven]}
      go: {methods: [StringVariation, StringVariationCtx], ctxArg: {StringVariationCtx: 0},
           template: "{{client}}.StringValue({{goctx}}, {{key}}, {{default}}, {{evalctx}})",
           requires: [context-unproven]}
      # A null default is a String and is proven (getStringValue accepts null).
      java: {methods: [stringVariation], requires: [context-unproven, default-type-unproven],
             template: "#{any(dev.openfeature.sdk.Client)}.getStringValue(#{key}, #{default}, #{context})"}
  - id: number-variation
    message: "Migrate number flag {{key}} to OpenFeature"
    valueType: number
    risk: low
    keyArg: 0
    defaultArg: 2
    contextArg: 1
    languages:
      js: {methods: [numberVariation], async: true,
           template: "{{client}}.getNumberValue({{key}}, {{default}}, {{context}})",
           requires: [context-unproven]}
      go: {methods: [Float64Variation, Float64VariationCtx], ctxArg: {Float64VariationCtx: 0},
           template: "{{client}}.FloatValue({{goctx}}, {{key}}, {{default}}, {{evalctx}})",
           requires: [context-unproven]}
      # LD doubleVariation returns double; the default must be exactly double (an int literal
      # would not box to Double after the rewrite), and the result is unboxed (ADR 009 D8).
      java: {methods: [doubleVariation], requires: [context-unproven, default-type-unproven],
             template: "#{any(dev.openfeature.sdk.Client)}.getDoubleValue(#{key}, #{default}, #{context}).doubleValue()"}
  # Separate from number-variation (JS numberVariation / Go Float64Variation) because Java has
  # both intVariation and doubleVariation and one rule holds one valueType and one template.
  - id: java-int-variation
    message: "Migrate integer flag {{key}} to OpenFeature"
    valueType: integer
    risk: low
    keyArg: 0
    defaultArg: 2
    contextArg: 1
    languages:
      java: {methods: [intVariation], requires: [context-unproven, default-type-unproven],
             template: "#{any(dev.openfeature.sdk.Client)}.getIntegerValue(#{key}, #{default}, #{context}).intValue()"}
  - id: json-variation
    message: "Migrate JSON flag {{key}} to OpenFeature"
    valueType: object
    risk: medium
    keyArg: 0
    defaultArg: 2
    contextArg: 1
    languages:
      js: {methods: [jsonVariation], async: true,
           template: "{{client}}.getObjectValue({{key}}, {{default}}, {{context}})",
           requires: [context-unproven]}

  # ---- report-only: type mismatch ----
  # Go IntVariation returns int; OpenFeature IntValue returns int64.
  - id: int-variation
    valueType: integer
    risk: low
    keyArg: 0
    languages:
      go: {methods: [IntVariation, IntVariationCtx], ctxArg: {IntVariationCtx: 0}, argCount: {min: 3, max: 3}}
    skip: type-mismatch
  # Go JSONVariation takes/returns ldvalue.Value; OpenFeature ObjectValue uses any.
  # Separate from json-variation because `skip` is rule-level and JS json is rewritable.
  - id: go-json-variation
    valueType: object
    risk: medium
    keyArg: 0
    languages:
      go: {methods: [JSONVariation, JSONVariationCtx], ctxArg: {JSONVariationCtx: 0}, argCount: {min: 3, max: 3}}
    skip: type-mismatch
  # Java jsonValueVariation takes/returns LDValue; OpenFeature getObjectValue uses Value.
  - id: java-json-variation
    valueType: object
    risk: medium
    keyArg: 0
    languages:
      java: {methods: [jsonValueVariation], argCount: {min: 3, max: 3}}
    skip: type-mismatch
  # JS generic variation() returns any; the target typed method cannot be
  # chosen from the call alone.
  - id: variation
    risk: medium
    keyArg: 0
    languages:
      js: {methods: [variation], argCount: {min: 3, max: 4}}
    skip: type-mismatch

  # Migration flags return a stage plus an operation tracker, not a plain value.
  - id: migration-variation
    risk: high
    keyArg: 0
    languages:
      js: {methods: [migrationVariation], argCount: {min: 3, max: 3}}
      go: {methods: [MigrationVariation, MigrationVariationCtx], ctxArg: {MigrationVariationCtx: 0}, argCount: {min: 3, max: 3}}
      java: {methods: [migrationVariation], argCount: {min: 3, max: 3}}
    skip: type-mismatch

  # ---- report-only: detail ----
  - id: bool-variation-detail
    risk: high
    keyArg: 0
    languages:
      js: {methods: [boolVariationDetail], argCount: {min: 3, max: 3}}
      go: {methods: [BoolVariationDetail, BoolVariationDetailCtx], ctxArg: {BoolVariationDetailCtx: 0}, argCount: {min: 3, max: 3}}
      java: {methods: [boolVariationDetail], argCount: {min: 3, max: 3}}
    skip: detail
  - id: string-variation-detail
    risk: high
    keyArg: 0
    languages:
      js: {methods: [stringVariationDetail], argCount: {min: 3, max: 3}}
      go: {methods: [StringVariationDetail, StringVariationDetailCtx], ctxArg: {StringVariationDetailCtx: 0}, argCount: {min: 3, max: 3}}
      java: {methods: [stringVariationDetail], argCount: {min: 3, max: 3}}
    skip: detail
  - id: number-variation-detail
    risk: high
    keyArg: 0
    languages:
      js: {methods: [numberVariationDetail], argCount: {min: 3, max: 3}}
      go: {methods: [Float64VariationDetail, Float64VariationDetailCtx], ctxArg: {Float64VariationDetailCtx: 0}, argCount: {min: 3, max: 3}}
      java: {methods: [doubleVariationDetail], argCount: {min: 3, max: 3}}
    skip: detail
  - id: int-variation-detail
    risk: high
    keyArg: 0
    languages:
      go: {methods: [IntVariationDetail, IntVariationDetailCtx], ctxArg: {IntVariationDetailCtx: 0}, argCount: {min: 3, max: 3}}
      java: {methods: [intVariationDetail], argCount: {min: 3, max: 3}}
    skip: detail
  - id: json-variation-detail
    risk: high
    keyArg: 0
    languages:
      js: {methods: [jsonVariationDetail], argCount: {min: 3, max: 3}}
      go: {methods: [JSONVariationDetail, JSONVariationDetailCtx], ctxArg: {JSONVariationDetailCtx: 0}, argCount: {min: 3, max: 3}}
      java: {methods: [jsonValueVariationDetail], argCount: {min: 3, max: 3}}
    skip: detail
  - id: variation-detail
    risk: high
    keyArg: 0
    languages:
      js: {methods: [variationDetail], argCount: {min: 3, max: 4}}
    skip: detail

  # ---- report-only: bulk ----
  - id: all-flags-state
    risk: high
    languages:
      js: {methods: [allFlagsState], argCount: {min: 1, max: 3}}
      go: {methods: [AllFlagsState], argCount: {min: 1}}
      # allFlagsState(LDContext, FlagsStateOption...): variadic, so no max.
      java: {methods: [allFlagsState], argCount: {min: 1}}
    skip: bulk
