# fldlint rules: language-neutral source of truth. Schema: spec/schema/rules.schema.json.
#
# Argument positions (keyArg/defaultArg/contextArg) are for the base (non-Ctx)
# call: JS and Go both use (key, context, default). Go *Ctx methods take a
# leading context.Context at the index given by ctxArg; the remaining positions
# shift by one for those methods.
#
# Sources: JS method list from flaglint-js scanner (LD_FLAG_KEY_METHODS,
# LD_ALL_FLAGS_METHODS); Go from flaglint-go methodSpecs, signatures checked
# against go-server-sdk v7 ldclient.go and openfeature-go client.go.
# "requires: [context-unproven]" (JS and Go) means the rewrite is only applied
# when the LD context -> EvaluationContext conversion can be proven (JS: a
# literal { key } / { kind: "user", key } object; Go: ldcontext.New(x));
# otherwise the planner reports skip=context-unproven.
#
# `message` (rewriting rules only) is the diagnostic text for a rewritable
# finding; the only placeholder allowed in it is {{key}}.
#
# JS method list verified against @launchdarkly/node-server-sdk 9.17.1 and
# @launchdarkly/js-server-sdk-common 2.26.8 typings: allFlags and
# isFeatureEnabled do not exist there (they were only in the legacy
# launchdarkly-node-server-sdk) and are therefore not listed.
version: 1
skipCategories:
  detail:           {severity: warning, message: "Detail call; reason/variation metadata has no 1:1 rewrite"}
  bulk:             {severity: warning, message: "Bulk evaluation; migrate manually"}
  dynamic-key:      {severity: warning, message: "Flag key is not a static string"}
  unbound-client:   {severity: warning, message: "OpenFeature client binding not proven in scope"}
  type-mismatch:    {severity: warning, message: "Return/default type differs between SDKs"}
  context-unproven: {severity: warning, message: "Cannot prove LD context -> EvaluationContext conversion"}
  default-type-unproven: {severity: warning, message: "Default value type not proven"}
rules:
  # ---- rewritable rules ----
  - id: bool-variation
    message: "Migrate boolean flag {{key}} to OpenFeature"
    valueType: boolean
    risk: low
    keyArg: 0
    defaultArg: 2
    contextArg: 1
    languages:
      js:   {methods: [boolVariation], async: true,
             template: "{{client}}.getBooleanValue({{key}}, {{default}}, {{context}})",
             requires: [context-unproven]}
      go:   {methods: [BoolVariation, BoolVariationCtx], ctxArg: {BoolVariationCtx: 0},
             template: "{{client}}.BooleanValue({{goctx}}, {{key}}, {{default}}, {{evalctx}})",
             requires: [context-unproven]}
      # UNVERIFIED: Java mapping not checked against the LD Java SDK / OpenFeature Java SDK (M3).
      java: {methods: [boolVariation],
             template: "#{any(dev.openfeature.sdk.Client)}.getBooleanValue(#{key}, #{default}, #{context})"}
  - id: string-variation
    message: "Migrate string flag {{key}} to OpenFeature"
    valueType: string
    risk: low
    keyArg: 0
    defaultArg: 2
    contextArg: 1
    languages:
      js: {methods: [stringVariation], async: true,
           template: "{{client}}.getStringValue({{key}}, {{default}}, {{context}})",
           requires: [context-unproven]}
      go: {methods: [StringVariation, StringVariationCtx], ctxArg: {StringVariationCtx: 0},
           template: "{{client}}.StringValue({{goctx}}, {{key}}, {{default}}, {{evalctx}})",
           requires: [context-unproven]}
  - id: number-variation
    message: "Migrate number flag {{key}} to OpenFeature"
    valueType: number
    risk: low
    keyArg: 0
    defaultArg: 2
    contextArg: 1
    languages:
      js: {methods: [numberVariation], async: true,
           template: "{{client}}.getNumberValue({{key}}, {{default}}, {{context}})",
           requires: [context-unproven]}
      go: {methods: [Float64Variation, Float64VariationCtx], ctxArg: {Float64VariationCtx: 0},
           template: "{{client}}.FloatValue({{goctx}}, {{key}}, {{default}}, {{evalctx}})",
           requires: [context-unproven]}
  - id: json-variation
    message: "Migrate JSON flag {{key}} to OpenFeature"
    valueType: object
    risk: medium
    keyArg: 0
    defaultArg: 2
    contextArg: 1
    languages:
      js: {methods: [jsonVariation], async: true,
           template: "{{client}}.getObjectValue({{key}}, {{default}}, {{context}})",
           requires: [context-unproven]}

  # ---- report-only: type mismatch ----
  # Go IntVariation returns int; OpenFeature IntValue returns int64.
  - id: int-variation
    valueType: integer
    risk: low
    languages:
      go: {methods: [IntVariation, IntVariationCtx], ctxArg: {IntVariationCtx: 0}}
    skip: type-mismatch
  # Go JSONVariation takes/returns ldvalue.Value; OpenFeature ObjectValue uses any.
  # Separate from json-variation because `skip` is rule-level and JS json is rewritable.
  - id: go-json-variation
    valueType: object
    risk: medium
    languages:
      go: {methods: [JSONVariation, JSONVariationCtx], ctxArg: {JSONVariationCtx: 0}}
    skip: type-mismatch
  # JS generic variation() returns any; the target typed method cannot be
  # chosen from the call alone.
  - id: variation
    risk: medium
    languages:
      js: {methods: [variation]}
    skip: type-mismatch

  # Migration flags return a stage plus an operation tracker, not a plain value.
  - id: migration-variation
    risk: high
    languages:
      js: {methods: [migrationVariation]}
      go: {methods: [MigrationVariation, MigrationVariationCtx], ctxArg: {MigrationVariationCtx: 0}}
    skip: type-mismatch

  # ---- report-only: detail ----
  - id: bool-variation-detail
    risk: high
    languages:
      js: {methods: [boolVariationDetail]}
      go: {methods: [BoolVariationDetail, BoolVariationDetailCtx], ctxArg: {BoolVariationDetailCtx: 0}}
    skip: detail
  - id: string-variation-detail
    risk: high
    languages:
      js: {methods: [stringVariationDetail]}
      go: {methods: [StringVariationDetail, StringVariationDetailCtx], ctxArg: {StringVariationDetailCtx: 0}}
    skip: detail
  - id: number-variation-detail
    risk: high
    languages:
      js: {methods: [numberVariationDetail]}
      go: {methods: [Float64VariationDetail, Float64VariationDetailCtx], ctxArg: {Float64VariationDetailCtx: 0}}
    skip: detail
  - id: int-variation-detail
    risk: high
    languages:
      go: {methods: [IntVariationDetail, IntVariationDetailCtx], ctxArg: {IntVariationDetailCtx: 0}}
    skip: detail
  - id: json-variation-detail
    risk: high
    languages:
      js: {methods: [jsonVariationDetail]}
      go: {methods: [JSONVariationDetail, JSONVariationDetailCtx], ctxArg: {JSONVariationDetailCtx: 0}}
    skip: detail
  - id: variation-detail
    risk: high
    languages:
      js: {methods: [variationDetail]}
    skip: detail

  # ---- report-only: bulk ----
  - id: all-flags-state
    risk: high
    languages:
      js: {methods: [allFlagsState]}
      go: {methods: [AllFlagsState]}
    skip: bulk
