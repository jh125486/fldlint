# Real-repo corpus (issue #21, Part 2): public repositories that use the
# LaunchDarkly server SDK, pinned to a full commit SHA. `task corpus` clones
# each one into a temp dir, runs the fldlint tools in report mode, applies the
# fixes in the temp copy only, builds it, and compares the counts with
# spec/corpus-snapshot.json. Nothing is copied into this repository and nothing
# is ever pushed upstream. See scripts/corpus/README.md for the pass/fail rule.
#
# Fields per repo:
#   name     unique key, used in the snapshot and in `--only`
#   url      public HTTPS clone URL
#   sha      full 40-hex commit (the clone fetches exactly this commit)
#   license  SPDX id, for information only (confirms the source is public-readable)
#   note     why it is in the corpus / what to expect
#   timeout  seconds for everything about this repo (clone, deps, tools, builds)
#   depth    `git fetch --depth` value (1 is enough for a pinned SHA)
#
# Verified on 2026-11-26 with the GitHub API and a shallow clone + grep that
# every entry is public and calls the LaunchDarkly server SDK of its language.
#
# Considered and dropped:
#   e2b-dev/infra                                  no LaunchDarkly dependency or call (code search: none)
#   CMS-Enterprise/mint-app                        uses go-server-sdk v6; the Go analyzer handles v7 only
#   launchdarkly/hello-java                        Gradle build; the Java corpus runs rewrite-maven-plugin
#   launchdarkly/hello-openfeature-java-server     Gradle build, and it already calls OpenFeature
#   launchdarkly/hello-bootstrap                   no server-SDK variation call

js:
  - name: hello-node-server
    url: https://github.com/launchdarkly/hello-node-server
    sha: becd95a34abe9dd929f0f1a2c445aa331a4879bd
    language: js
    license: Apache-2.0
    note: Plain JavaScript, two `variation` calls on a dynamic flag key.
    timeout: 300
    depth: 1
  - name: hello-node-typescript
    url: https://github.com/launchdarkly/hello-node-typescript
    sha: dd1b12455f584cfce1fc43a12ae6d29ca23af1ae
    language: js
    license: Apache-2.0
    note: TypeScript with a tsconfig, so the post-fix `tsc --noEmit` runs.
    timeout: 600
    depth: 1
  - name: hello-openfeature-node-server
    url: https://github.com/launchdarkly/hello-openfeature-node-server
    sha: b6ed121abbfc36906596da6e6a1801a90e75452f
    language: js
    license: Apache-2.0
    note: Control. Already on OpenFeature with the LaunchDarkly provider; expect no findings.
    timeout: 300
    depth: 1

