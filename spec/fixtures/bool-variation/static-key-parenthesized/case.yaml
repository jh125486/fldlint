id: static-key-parenthesized
rule: bool-variation
tags: [key-parenthesized]
description: A parenthesized string-literal flag key is as static as the bare literal, so it is rewritten and its fingerprint key is the literal's value in every language.
expect:
  js: {diagnostics: [{line: 8, col: 25, ruleId: bool-variation}], output: true}
  go: {diagnostics: [{line: 20, col: 18, ruleId: bool-variation}], output: true}
  java: {diagnostics: [{line: 12, col: 27, ruleId: bool-variation}], output: true}
