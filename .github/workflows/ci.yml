name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path filter for the Java job. Pushes to main always run everything; on a PR,
  # spec/** (and the generator, task and workflow files) runs everything too.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      java: ${{ steps.filter.outputs.java }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # On pull_request HEAD is the merge commit, so HEAD^1 is the base.
          fetch-depth: 2
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            {
              echo "code=true"
              echo "java=true"
              echo "workflows=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --no-renames --name-only HEAD^1 HEAD > changed.txt
          has() { grep -Eq "$1" changed.txt && echo true || echo false; }
          # code=false only when every changed file is documentation (Markdown or
          # docs/) outside the code trees; anything else counts as code. Renames
          # are listed as delete+add (--no-renames), so moving code into docs/
          # still counts as code. An empty diff counts as code.
          code=$(awk 'BEGIN { c = 0; n = 0 }
            { n++ }
            /^(spec|js|go|java|\.github)\// { c = 1 }
            !/(\.md$|^docs\/)/ { c = 1 }
            END { print (c || n == 0) ? "true" : "false" }' changed.txt)
          {
            echo "code=$code"
            echo "workflows=$(has '^(\.github/|Taskfile\.yml$|go/go\.(mod|sum)$)')"
            echo "java=$(has '^(java/|spec/|go/internal/spec/|Taskfile\.yml$|\.github/workflows/ci\.yml$)')"
          } >> "$GITHUB_OUTPUT"

  # Single entry point: the same `task check` developers run locally. The Java
  # tasks run in the separate path-filtered `java` job (needs a JDK).
  #
  # Where things run (the matrix keeps its names because they are required checks):
  #   Node 22 leg (the 22.13.0 engines floor): full `task check` = spec:check,
  #     lint (JS + Go), tests (JS + Go -race), parity, js:types-floor. Go, lint,
  #     spec and the @types/node floor do not depend on the Node version, so they
  #     run once, here.
  #   Node 24 and 26 legs: `task check:node` = only the Node-version-dependent
  #     parts: JS typecheck + ESLint, JS tests, and the JS side of parity.
  # spec:check (and everything else in `task check`) now runs only on the Node
  # 22.13 leg.
  # On a docs-only PR (see `changes`) every step is skipped but the job still
  # reports success under the same name, which a job-level `if` would not do
  # for matrix legs.
  check:
    needs: changes
    # Run even if `changes` failed, so a classifier failure fails the required
    # check instead of skipping it (a skipped job counts as passing).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLDLINT_SKIP_JAVA: "1"
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - if: needs.changes.result == 'success' && needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.changes.result == 'success' && needs.changes.outputs.code == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # 22 means the engines floor itself, so js:types-floor runs on Node 22.13.0 (M0.6)
          node-version: ${{ matrix.node == 22 && '22.13.0' || matrix.node }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - if: needs.changes.result == 'success' && needs.changes.outputs.code == 'true'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - if: needs.changes.result == 'success' && needs.changes.outputs.code == 'true'
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - if: needs.changes.result == 'success' && needs.changes.outputs.code == 'true'
        run: ${{ matrix.node == 22 && 'task check' || 'task check:node' }}
      - name: Fail if the change classifier failed
        if: needs.changes.result != 'success'
        run: echo "::error::the changes job did not succeed, so nothing was checked" && exit 1

  # Java build, lint and conformance harness (ADR 009 D7: JDK 21 builds, release 8 targets).
  java:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.java == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: java/pom.xml
      # setup-java's cache covers ~/.m2/repository only; cache the wrapper's Maven
      # distribution too so mvnw does not re-download it every run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/wrapper
          key: mvn-wrapper-${{ runner.os }}-${{ hashFiles('java/.mvn/wrapper/maven-wrapper.properties') }}
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task java:lint java:test

  # ESLint 9 is in the plugin's peer range, so keep it tested (the main job runs ESLint 10).
  eslint-9:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: js/package-lock.json
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task js:test-eslint9

  # Non-required canary: tells us when TypeScript 7 (native port) becomes viable
  # with our toolchain. Never add to required checks (remove with M0.6 follow-up
  # once typescript-eslint supports TS 7 and we adopt it).
  typescript-next:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: js/package-lock.json
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task js:ts-next

  # Lints the workflows themselves (actionlint + zizmor) via the same
  # `task workflows:lint` developers run locally. Not part of `task check`
  # (it needs uv). Whether it is a required check is an owner decision.
  workflows:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task workflows:lint
