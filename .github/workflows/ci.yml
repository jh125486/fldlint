name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Per-language path scoping. Anything that is not a pull_request (today only
  # pushes to main) runs everything; on a PR the classifier script maps the changed
  # paths to go/js/java flags plus `shared` (any non-docs change). Shared inputs
  # such as spec/**, generated files, Taskfile.yml and .github/** turn on all
  # three; an empty or unrecognized list fails safe to all. Gates test
  # `!= 'false'`, so a missing or empty output means run. Jobs gate their steps,
  # not the jobs, where a check is required.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.filter.outputs.go }}
      js: ${{ steps.filter.outputs.js }}
      java: ${{ steps.filter.outputs.java }}
      shared: ${{ steps.filter.outputs.shared }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # On pull_request HEAD is the merge commit, so HEAD^1 is the base.
          fetch-depth: 2
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            {
              echo "go=true"
              echo "js=true"
              echo "java=true"
              echo "shared=true"
              echo "workflows=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -c core.quotePath=false diff --no-renames --name-only HEAD^1 HEAD > changed.txt
          .github/scripts/classify-changes.sh < changed.txt > flags.txt
          cat flags.txt
          cat flags.txt >> "$GITHUB_OUTPUT"

  # Same tasks developers run locally (`task check` = check:shared + check:go +
  # check:js + Java). The Java tasks run in the separate `java` job (needs a JDK).
  #
  # Where things run (the matrix keeps its names because they are required checks):
  #   Node 22 leg (the 22.13.0 engines floor):
  #     check:shared (spec:check, workflows:test, parity) when `shared` is set,
  #     check:go (lint + race tests) when `go` is set,
  #     check:js (lint, tests, js:types-floor) when `js` is set.
  #     Go, spec and the @types/node floor do not depend on the Node version, so
  #     they run once, here. Node and npm ci stay on this leg because the spec
  #     generator is JS.
  #   Node 24 and 26 legs: `task check:node` (JS typecheck + ESLint, JS tests, the
  #     JS side of parity), only when `js` is set.
  # A step that does not apply is skipped but the job still reports success under
  # the same name, which a job-level `if` would not do for matrix legs.
  check:
    needs: changes
    # Run even if `changes` failed, so a classifier failure fails the required
    # check instead of skipping it (a skipped job counts as passing).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLDLINT_SKIP_JAVA: "1"
      # Whether this leg needs the toolchain at all.
      SETUP: ${{ needs.changes.result == 'success' && ((matrix.node == 22 && needs.changes.outputs.shared != 'false') || (matrix.node != 22 && needs.changes.outputs.js != 'false')) }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - if: env.SETUP == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.SETUP == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # 22 means the engines floor itself, so js:types-floor runs on Node 22.13.0 (M0.6)
          node-version: ${{ matrix.node == 22 && '22.13.0' || matrix.node }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - if: env.SETUP == 'true'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: |
            go/go.sum
            go/golangci/go.sum
      - if: env.SETUP == 'true'
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: check:shared
        if: env.SETUP == 'true' && matrix.node == 22 && needs.changes.outputs.shared != 'false'
        run: task check:shared
      - name: check:go
        if: env.SETUP == 'true' && matrix.node == 22 && needs.changes.outputs.go != 'false'
        run: task check:go
      - name: check:js
        if: env.SETUP == 'true' && matrix.node == 22 && needs.changes.outputs.js != 'false'
        run: task check:js
      - name: check:node
        if: env.SETUP == 'true' && matrix.node != 22 && needs.changes.outputs.js != 'false'
        run: task check:node
      - name: Fail if the change classifier failed
        if: needs.changes.result != 'success'
        run: echo "::error::the changes job did not succeed, so nothing was checked" && exit 1

  # Java build, lint, conformance harness and the rewrite-maven-plugin smoke project
  # (ADR 009 D7: JDK 21 builds, release 8 targets). Runs when the java flag is set.
  java:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.java != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: |
            java/pom.xml
            java/smoke/pom.xml
      # setup-java's cache covers ~/.m2/repository only; cache the wrapper's Maven
      # distribution too so mvnw does not re-download it every run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/wrapper
          key: mvn-wrapper-${{ runner.os }}-${{ hashFiles('java/.mvn/wrapper/maven-wrapper.properties') }}
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task java:lint java:test java:smoke

  # golangci-lint module plugin smoke (issue #18): builds a custom golangci-lint
  # with the plugin and runs it on one fixture. Not a required check. Steps are
  # gated on the `go` flag (fail-open `!= 'false'`), not the job, so the job
  # always reports.
  golangci-plugin:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SETUP: ${{ needs.changes.result != 'success' || needs.changes.outputs.go != 'false' }}
    steps:
      - if: env.SETUP == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.SETUP == 'true'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: |
            go/go.sum
            go/golangci/go.sum
      - if: env.SETUP == 'true'
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: go:plugin-smoke
        if: env.SETUP == 'true'
        run: task go:plugin-smoke

  # ESLint 9 is in the plugin's peer range, so keep it tested (the main job runs ESLint 10).
  eslint-9:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.js != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: js/package-lock.json
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task js:test-eslint9

  # Non-required canary: tells us when TypeScript 7 (native port) becomes viable
  # with our toolchain. Never add to required checks (remove with M0.6 follow-up
  # once typescript-eslint supports TS 7 and we adopt it).
  typescript-next:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.js != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: js/package-lock.json
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task js:ts-next

  # Lints the workflows themselves (actionlint + zizmor) via the same
  # `task workflows:lint` developers run locally. Not part of `task check`
  # (it needs uv). Whether it is a required check is an owner decision.
  workflows:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.workflows != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task workflows:lint
