name: Validate PR title

on:
  # zizmor: ignore[dangerous-triggers] pull_request_target is needed for a token that can read fork PRs; this job has no checkout, runs no PR code, and only calls the title-validation action with pull-requests: read.
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
