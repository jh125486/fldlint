name: Corpus

# Issue #21 Part 2: read-only dry runs of the three tools over the pinned public
# repos in spec/corpus.json. Not a required check. Fixes are applied in temp
# copies only; nothing is pushed, opened or commented upstream. No secrets, and no
# dependency caches are restored or saved: third-party builds run here, so nothing they
# write may be persisted for other workflows to pick up.
on:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus
  cancel-in-progress: false

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go/go.mod
          cache: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - name: Install JS dependencies
        run: npm ci
        working-directory: js
      - name: Run the corpus
        run: node scripts/corpus/run.mjs run --out tmp/corpus/result.json
      - name: Compare with the snapshot
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          node scripts/corpus/run.mjs summary tmp/corpus/result.json >> "$GITHUB_STEP_SUMMARY"
          node scripts/corpus/run.mjs compare tmp/corpus/result.json
      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-result
          path: |
            tmp/corpus/result.json
            tmp/corpus/*.fix.patch
          if-no-files-found: ignore
          retention-days: 14
