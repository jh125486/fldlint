name: Bug report
description: Something fldlint reports or rewrites incorrectly
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For security issues (for example a rewrite that silently changes behavior), use the Security policy instead of this form.
  - type: dropdown
    id: engine
    attributes:
      label: Engine
      options: [JS/TS, Go, Java, Spec / fixtures, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Input code
      description: Smallest snippet that reproduces the problem.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the command you ran and its output.
    validations:
      required: true
