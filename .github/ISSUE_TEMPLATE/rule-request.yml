name: Rule request
description: Propose a new migration rule
title: "feat: rule for "
labels: ["rule-request"]
body:
  - type: input
    id: sdk
    attributes:
      label: SDK
      description: Vendor SDK and language, e.g. @launchdarkly/node-server-sdk (JS).
    validations:
      required: true
  - type: input
    id: method
    attributes:
      label: SDK method
      description: The call to detect, e.g. boolVariation.
    validations:
      required: true
  - type: input
    id: openfeature
    attributes:
      label: OpenFeature equivalent
      description: e.g. client.getBooleanValue.
    validations:
      required: true
  - type: textarea
    id: before
    attributes:
      label: Before
      render: text
    validations:
      required: true
  - type: textarea
    id: after
    attributes:
      label: After
      render: text
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Behavioral differences, context argument changes, edge cases.
