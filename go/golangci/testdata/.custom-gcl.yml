# Example `golangci-lint custom` config for the fldlint module plugin.
#
# Development form (this repository): both modules come from the local checkout
# via `path`. The plugin module's own go.mod `replace` is not honoured by the
# generated build module, so the analyzer module is listed too.
#
# For a released fldlint, drop `path` and pin versions instead. UNVERIFIED (no
# tags exist yet). Before tagging go/golangci/vX.Y.Z, bump `require
# github.com/jh125486/fldlint/go` in go/golangci/go.mod to a real tag (the
# `replace` there is ignored by the generated build).
#
#   plugins:
#     - module: 'github.com/jh125486/fldlint/go/golangci'
#       import: 'github.com/jh125486/fldlint/go/golangci'
#       version: vX.Y.Z
version: v2.15.0
name: custom-gcl
destination: .
plugins:
  - module: 'github.com/jh125486/fldlint/go/golangci'
    import: 'github.com/jh125486/fldlint/go/golangci'
    path: ..
  - module: 'github.com/jh125486/fldlint/go'
    import: 'github.com/jh125486/fldlint/go/analyzer'
    path: ../..
